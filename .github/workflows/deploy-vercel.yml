name: Deploy to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_run:
    workflows:
      - Sync ShipModel
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: vercel-production-main
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || vars.VERCEL_ORG_ID || 'team_k1J4m9vcNlbXhtEsI75GJfnM' }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || vars.VERCEL_PROJECT_ID || 'prj_CceS2Hj0KEGcqic7y5AS8zZABjyH' }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || secrets.VERCEL_API_KEY }}

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout aila
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Validate Vercel credentials
        run: |
          test -n "$VERCEL_TOKEN" || (echo "Missing VERCEL_TOKEN or VERCEL_API_KEY secret" && exit 1)
          test -n "$VERCEL_ORG_ID" || (echo "Missing VERCEL_ORG_ID secret or variable" && exit 1)
          test -n "$VERCEL_PROJECT_ID" || (echo "Missing VERCEL_PROJECT_ID secret or variable" && exit 1)

      - name: Install dependencies
        run: npm ci

      - name: Run baseline tests
        run: npm run test:baseline

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Vercel output
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy Vercel output
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
