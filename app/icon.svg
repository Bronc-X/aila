<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <!-- 深邃极简的黑曜石背景 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1816" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    
    <!-- 飘逸的极光般琥珀/橘金渐变 -->
    <linearGradient id="auroraGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#9A3412" />
    </linearGradient>

    <!-- 柔和细腻的飘逸辉光 -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 浑圆高级的物理质感边界 -->
  <rect width="256" height="256" rx="64" fill="url(#bgGrad)"/>
  
  <!-- 飘逸的优雅流线 (极简的贝塞尔曲线) -->
  <path d="M 0 160 Q 128 200 256 120" stroke="url(#auroraGlow)" stroke-width="1.5" fill="none" opacity="0.4" filter="url(#softGlow)"/>
  <path d="M 0 180 Q 128 230 256 140" stroke="url(#auroraGlow)" stroke-width="0.5" fill="none" opacity="0.15"/>

  <!-- 飘逸的极细斜体无衬线字体 (Toni) -->
  <text 
    x="132" y="154" 
    font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" 
    font-size="76" 
    font-style="italic" 
    font-weight="200" 
    fill="url(#auroraGlow)" 
    text-anchor="middle" 
    letter-spacing="6"
    filter="url(#softGlow)">
    Toni
  </text>
  
</svg>
