<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:,">
  <title>FDE 企业实战案例库</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07090a;
      --panel: #111619;
      --ink: #f4f1e8;
      --muted: #a6afb4;
      --line: #3a454b;
      --line-strong: #6b777d;
      --acid: #d7ff4f;
      --cyan: #5de1ff;
      --mono: "Cascadia Mono", "SFMono-Regular", Consolas, monospace;
      --serif: "Iowan Old Style", "Songti SC", STSong, Georgia, serif;
      --sans: Aptos, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      color: var(--ink);
      background:
        linear-gradient(rgba(255,255,255,.024) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px),
        var(--bg);
      background-size: 32px 32px;
      font-family: var(--sans);
      letter-spacing: 0;
    }

    button { font: inherit; }
    button:focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; }

    .picker {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      overflow: auto;
      padding: 28px;
      background:
        linear-gradient(rgba(255,255,255,.024) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px),
        var(--bg);
      background-size: 32px 32px;
      transition: opacity 180ms ease, visibility 180ms ease;
    }

    .picker[hidden] { display: none; }

    .picker-inner {
      width: min(1180px, 100%);
      border-top: 1px solid var(--line-strong);
      border-bottom: 1px solid var(--line-strong);
      padding: 34px 0;
    }

    .picker-kicker {
      margin: 0;
      color: var(--cyan);
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 900;
    }

    .picker h1 {
      max-width: 900px;
      margin: 18px 0 12px;
      font-family: var(--serif);
      font-size: clamp(44px, 7vw, 88px);
      line-height: .98;
    }

    .picker-lead {
      max-width: 720px;
      margin: 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.6;
    }

    .case-options {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 34px;
    }

    .case-option {
      position: relative;
      min-height: 360px;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 4px;
      color: var(--ink);
      background: rgba(17, 22, 25, .96);
      cursor: pointer;
      text-align: left;
      transition: border-color 150ms ease, transform 150ms ease;
    }

    .case-option-preview {
      position: relative;
      display: block;
      aspect-ratio: 16 / 8.2;
      margin: -8px -8px 22px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .12);
      background: #070a0c;
    }

    .case-option-preview::after {
      position: absolute;
      inset: 0;
      content: "";
      background:
        linear-gradient(180deg, transparent 52%, rgba(7, 9, 10, .78)),
        linear-gradient(90deg, rgba(7, 9, 10, .18), transparent 36%);
      pointer-events: none;
    }

    .case-option-preview img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top left;
      filter: saturate(.82) contrast(1.04);
      transition: transform 260ms ease, filter 260ms ease;
    }

    .case-option:hover .case-option-preview img {
      transform: scale(1.018);
      filter: saturate(1) contrast(1.06);
    }

    .case-option:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
    }

    .case-option::after {
      position: absolute;
      right: 20px;
      bottom: 18px;
      color: var(--accent);
      content: "→";
      font-family: var(--mono);
      font-size: 30px;
    }

    .case-option.crossborder { --accent: var(--acid); }
    .case-option.immigration { --accent: var(--cyan); }

    .case-no {
      color: var(--accent);
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 900;
    }

    .case-option strong {
      display: block;
      max-width: 520px;
      margin-top: 32px;
      font-family: var(--serif);
      font-size: clamp(26px, 3vw, 40px);
      line-height: 1.08;
    }

    .case-option span:last-of-type {
      display: block;
      max-width: 480px;
      margin-top: 14px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .workspace {
      display: grid;
      grid-template-rows: 58px minmax(0, 1fr);
      height: 100vh;
    }

    .workspace[hidden] { display: none; }

    .switcher {
      position: relative;
      z-index: 10;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 8px 10px;
      border-bottom: 1px solid var(--line-strong);
      background: rgba(7, 9, 10, .97);
      box-shadow: 0 12px 38px rgba(0, 0, 0, .32);
    }

    .switcher-title {
      display: flex;
      min-width: 0;
      gap: 10px;
      align-items: center;
    }

    .home-button,
    .case-tab,
    .reel-button {
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 3px;
      color: var(--muted);
      background: #101518;
      cursor: pointer;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 800;
    }

    .home-button {
      width: 42px;
      color: var(--ink);
      font-size: 17px;
    }

    .switcher-name {
      overflow: hidden;
      font-family: var(--serif);
      font-size: 17px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .case-tabs { display: flex; gap: 7px; }
    .case-tab { padding: 0 13px; }
    .reel-button { padding: 0 13px; color: var(--ink); }
    .case-tab:hover { color: var(--ink); border-color: var(--line-strong); }
    .reel-button:hover { border-color: var(--cyan); color: var(--cyan); }
    .case-tab.active[data-case="crossborder"] { color: var(--acid); border-color: var(--acid); }
    .case-tab.active[data-case="immigration"] { color: var(--cyan); border-color: var(--cyan); }

    .frame-shell { position: relative; min-height: 0; background: #050708; }
    .case-frame { display: block; width: 100%; height: 100%; border: 0; background: #050708; }
    .reel-overlay {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: grid;
      place-items: center;
      padding: 28px;
      background: rgba(2, 4, 5, .92);
      backdrop-filter: blur(18px);
    }
    .reel-overlay[hidden] { display: none; }
    .reel-dialog {
      width: min(1180px, 100%);
      border: 1px solid var(--line-strong);
      background: #050708;
      box-shadow: 0 32px 100px rgba(0, 0, 0, .62);
    }
    .reel-head {
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px 0 18px;
      border-bottom: 1px solid var(--line);
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 900;
    }
    .reel-close {
      min-height: 34px;
      padding: 0 12px;
      border: 1px solid var(--line);
      color: var(--ink);
      background: #101518;
      cursor: pointer;
      font-family: var(--mono);
      font-size: 11px;
    }
    .reel-close:hover { border-color: var(--cyan); color: var(--cyan); }
    .reel-video {
      display: block;
      width: 100%;
      max-height: calc(100vh - 150px);
      background: #020304;
    }
    .loading {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--muted);
      background: var(--bg);
      font-family: var(--mono);
      font-size: 12px;
    }
    .loading[hidden] { display: none; }

    @media (max-width: 720px) {
      .picker { padding: 16px; }
      .picker-inner { padding: 24px 0; }
      .picker h1 { font-size: 46px; }
      .case-options { grid-template-columns: 1fr; }
      .case-option { min-height: 330px; }
      .workspace { grid-template-rows: 108px minmax(0, 1fr); }
      .switcher {
        grid-template-columns: 1fr;
        align-content: center;
      }
      .case-tabs { width: 100%; }
      .case-tab { flex: 1; min-width: 0; padding: 0 6px; }
      .reel-button { flex: 0 0 auto; padding: 0 10px; }
      .reel-overlay { padding: 10px; }
    }
  </style>
</head>
<body>
  <section class="picker" id="picker" aria-labelledby="pickerTitle">
    <div class="picker-inner">
      <p class="picker-kicker">FDE FIELD LIBRARY / TWO COMPLETE CASES</p>
      <h1 id="pickerTitle">选择一个企业现场，进入完整系统。</h1>
      <p class="picker-lead">两个案例共享 FDE、RAG、Harness、工具、记忆和 Eval 的底层方法，但业务对象、风险和交付路径不同。</p>
      <div class="case-options">
        <button class="case-option crossborder" type="button" data-open-case="crossborder">
          <span class="case-option-preview" aria-hidden="true">
            <img src="/projects/fde-cases/crossborder.png" alt="">
          </span>
          <span class="case-no">CASE 01 / CROSS-BORDER COMMERCE</span>
          <strong>深圳跨境询盘到报价 Agent</strong>
          <span>从一封 B2B 询盘进入 CRM、检索产品证据、查库存定价、人工审批并完成报价。</span>
        </button>
        <button class="case-option immigration" type="button" data-open-case="immigration">
          <span class="case-option-preview" aria-hidden="true">
            <img src="/projects/fde-cases/immigration.png" alt="">
          </span>
          <span class="case-no">CASE 02 / IMMIGRATION SERVICES</span>
          <strong>深圳移民公司 AI 中控</strong>
          <span>从主动内容获客和公司个微工作号询盘，进入顾问预评估、签约办案、渠道门户、客户查询与老板看板。</span>
        </button>
      </div>
    </div>
  </section>

  <section class="workspace" id="workspace" hidden>
    <header class="switcher">
      <div class="switcher-title">
        <button class="home-button" id="homeButton" type="button" aria-label="返回案例选择" title="返回案例选择">←</button>
        <strong class="switcher-name" id="switcherName">FDE 企业实战案例库</strong>
      </div>
      <div class="case-tabs" role="tablist" aria-label="切换案例">
        <button class="case-tab" type="button" data-case="crossborder" role="tab">跨境询盘</button>
        <button class="case-tab" type="button" data-case="immigration" role="tab">移民中控</button>
        <button class="reel-button" id="caseReelButton" type="button">页面实录</button>
      </div>
    </header>
    <div class="frame-shell">
      <div class="loading" id="loading">LOADING CASE...</div>
      <iframe class="case-frame" id="caseFrame" title="FDE 企业实战案例"></iframe>
    </div>
  </section>

  <div class="reel-overlay" id="caseReel" hidden>
    <div class="reel-dialog" role="dialog" aria-modal="true" aria-labelledby="caseReelTitle">
      <div class="reel-head">
        <span id="caseReelTitle">CASE WALKTHROUGH</span>
        <button class="reel-close" id="caseReelClose" type="button">关闭</button>
      </div>
      <video class="reel-video" id="caseReelVideo" controls muted playsinline preload="metadata"></video>
    </div>
  </div>

  <script>
    const caseMeta = {
      crossborder: {
        name: "深圳跨境询盘到报价 Agent",
        title: "FDE 案例 01：深圳跨境询盘到报价 Agent",
        video: "/projects/fde-cases/crossborder-walkthrough.webm",
        poster: "/projects/fde-cases/crossborder.png"
      },
      immigration: {
        name: "深圳移民公司 AI 中控",
        title: "FDE 案例 02：深圳移民公司 AI 中控",
        video: "/projects/fde-cases/immigration-walkthrough.webm",
        poster: "/projects/fde-cases/immigration.png"
      }
    };

    const picker = document.getElementById("picker");
    const workspace = document.getElementById("workspace");
    const caseFrame = document.getElementById("caseFrame");
    const loading = document.getElementById("loading");
    const switcherName = document.getElementById("switcherName");
    const caseReel = document.getElementById("caseReel");
    const caseReelButton = document.getElementById("caseReelButton");
    const caseReelClose = document.getElementById("caseReelClose");
    const caseReelVideo = document.getElementById("caseReelVideo");
    const caseReelTitle = document.getElementById("caseReelTitle");
    const decoder = new TextDecoder();
    const caseSectionTargets = {
      immigration: {
        "31": "31-移民-fde-进场资料包-30-件"
      }
    };
    let activeCase = null;
    let pendingSectionId = null;

    function decodeCase(key) {
      const source = document.getElementById("case-" + key).textContent.trim();
      const bytes = Uint8Array.from(atob(source), character => character.charCodeAt(0));
      return decoder.decode(bytes);
    }

    function openCase(key, updateHash = true, section = null) {
      if (!caseMeta[key]) return;
      pendingSectionId = caseSectionTargets[key]?.[section] ?? null;
      picker.hidden = true;
      workspace.hidden = false;
      switcherName.textContent = caseMeta[key].name;
      document.title = caseMeta[key].title;
      document.querySelectorAll(".case-tab").forEach(tab => {
        const isActive = tab.dataset.case === key;
        tab.classList.toggle("active", isActive);
        tab.setAttribute("aria-selected", String(isActive));
      });
      if (activeCase !== key) {
        loading.hidden = false;
        caseFrame.srcdoc = decodeCase(key);
        activeCase = key;
      }
      if (updateHash) history.replaceState(null, "", "#" + key);
      localStorage.setItem("fde-case-library:last", key);
    }

    function openReel() {
      if (!activeCase) return;
      const meta = caseMeta[activeCase];
      caseReelTitle.textContent = meta.name + " / PAGE WALKTHROUGH";
      caseReelVideo.poster = meta.poster;
      caseReelVideo.src = meta.video;
      caseReel.hidden = false;
      caseReelVideo.play().catch(() => {});
      caseReelClose.focus();
    }

    function closeReel() {
      caseReelVideo.pause();
      caseReelVideo.removeAttribute("src");
      caseReelVideo.load();
      caseReel.hidden = true;
      caseReelButton.focus();
    }

    function showPicker() {
      if (!caseReel.hidden) closeReel();
      picker.hidden = false;
      workspace.hidden = true;
      document.title = "FDE 企业实战案例库";
      history.replaceState(null, "", location.pathname + location.search);
    }

    caseFrame.addEventListener("load", () => {
      loading.hidden = true;
      if (pendingSectionId) {
        caseFrame.contentDocument?.getElementById(pendingSectionId)?.scrollIntoView({
          behavior: "auto",
          block: "start"
        });
        pendingSectionId = null;
      }
      caseFrame.focus();
    });

    document.querySelectorAll("[data-open-case]").forEach(button => {
      button.addEventListener("click", () => openCase(button.dataset.openCase));
    });

    document.querySelectorAll(".case-tab").forEach(button => {
      button.addEventListener("click", () => openCase(button.dataset.case));
    });

    document.getElementById("homeButton").addEventListener("click", showPicker);
    caseReelButton.addEventListener("click", openReel);
    caseReelClose.addEventListener("click", closeReel);
    caseReel.addEventListener("click", event => {
      if (event.target === caseReel) closeReel();
    });
    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && !caseReel.hidden) closeReel();
    });

    const query = new URLSearchParams(location.search);
    const queryCase = query.get("case");
    const querySection = query.get("section");
    const hashCase = location.hash.slice(1);
    if (caseMeta[queryCase]) {
      openCase(queryCase, false, querySection);
    } else if (caseMeta[hashCase]) {
      openCase(hashCase, false);
    } else {
      showPicker();
    }
  </script>
