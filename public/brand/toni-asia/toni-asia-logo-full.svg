      .green{fill:#34a853}
      .amber{fill:#d97706}
      .word{font:700 172px/1 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:-2px}
      .sub{font:500 34px/1 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:7px;text-transform:uppercase}
    </style>
  </defs>
  <rect class="bg" width="1600" height="420" rx="54"/>
  <g transform="translate(88 62) scale(.29)">
