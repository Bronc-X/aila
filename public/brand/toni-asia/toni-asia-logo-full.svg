<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">toni.asia logo</title>
  <desc id="desc">The toni.asia logo with an original circular T mark and multicolor lowercase wordmark.</desc>
