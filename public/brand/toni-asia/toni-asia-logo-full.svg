    <text class="word yellow" x="196" y="120">n</text>
    <text class="word green" x="316" y="120">i</text>
    <text class="word ink" x="365" y="120">.</text>
    <text class="word blue" x="415" y="120">a</text>
    <text class="word red" x="530" y="120">s</text>
    <text class="word yellow" x="628" y="120">i</text>
