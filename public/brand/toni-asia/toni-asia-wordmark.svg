<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="260" viewBox="0 0 1120 260" role="img" aria-labelledby="title desc">
  <title id="title">toni.asia wordmark</title>
  <desc id="desc">A lowercase multicolor toni.asia wordmark.</desc>
  <defs>
    <style>
      .ink{fill:#151515}
      .blue{fill:#4285f4}
      .red{fill:#ea4335}
      .yellow{fill:#fbbc05}
      .green{fill:#34a853}
      .word{font:700 172px/1 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:-2px}
    </style>
  </defs>
  <text class="word blue" x="20" y="174">t</text>
  <text class="word red" x="102" y="174">o</text>
  <text class="word yellow" x="216" y="174">n</text>
  <text class="word green" x="336" y="174">i</text>
  <text class="word ink" x="385" y="174">.</text>
  <text class="word blue" x="435" y="174">a</text>
  <text class="word red" x="550" y="174">s</text>
  <text class="word yellow" x="648" y="174">i</text>
  <text class="word green" x="698" y="174">a</text>
</svg>
